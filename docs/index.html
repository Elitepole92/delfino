* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(120% 80% at 50% 0%, var(--sea-top), var(--sea-deep) 70%) fixed, var(--sea-deep);
  color: var(--ink); font: 15px/1.4 var(--font); overflow: hidden; touch-action: manipulation;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
}
.shell {
  background: linear-gradient(160deg, var(--shell-hi), var(--shell) 30%, var(--shell) 70%, var(--shell-dk));
  border-radius: 34px; padding: 16px 16px 20px; box-shadow: inset 0 -6px 0 var(--shell-dk), 0 18px 40px rgba(0,0,0,.45);
  display: flex; flex-direction: column; align-items: center; gap: 16px;
}
.bezel { background: #07090d; border-radius: 18px; padding: 10px; }
canvas {
  display: block; image-rendering: pixelated; border-radius: 6px; background: #0b3a5c;
  width: min(62vw, calc((100svh - 270px) * 0.5625), 300px); aspect-ratio: 135 / 240; height: auto;
}
.keys { display: flex; align-items: center; justify-content: center; gap: 30px; width: 100%; }
.key { display: grid; justify-items: center; gap: 5px; font-weight: 700; font-size: 11px; letter-spacing: .14em; color: rgba(255,255,255,.95); }
.key small { font-weight: 600; letter-spacing: .04em; font-size: 10px; opacity: .85; }
.key button {
  border: 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--key-hi), var(--key));
  color: #fff; font: 800 22px var(--font); box-shadow: 0 5px 0 rgba(0,0,0,.4); cursor: pointer;
}
#a { width: 82px; height: 82px; }
#b { width: 60px; height: 60px; font-size: 18px; }
.key button:active, .key button.down { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.4); }
.extras { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.pill {
  border: 1px solid rgba(159,195,217,.35); background: rgba(3,22,35,.55); color: var(--ink); border-radius: 999px;
  padding: 9px 16px; font: 600 14px var(--font); cursor: pointer;
}
.pill.on { border-color: var(--ok); color: var(--ok); }
.pill[hidden] { display: none; }
button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.update {
  position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 5;
  border: 0; border-radius: 999px; padding: 11px 18px; background: #ffcf4a; color: #062033; font: 700 14px var(--font);
  box-shadow: 0 8px 24px rgba(0,0,0,.4); cursor: pointer; max-width: calc(100vw - 32px);
}
.hint { color: var(--dim); font-size: 12.5px; text-align: center; max-width: 34ch; margin: 0; }
@media (prefers-reduced-motion: reduce) { .key button:active, .key button.down { transform: none; } }

const ICONS = [

  ['#.....#.....', '##....##....', '###...###...', '####..####..', '###...###...', '##....##....', '#.....#.....'],

  ['..#######..', '.#.......#.', '#..#####..#', '..#.....#..', '....###....', '...#...#...', '.....#.....', '.....#.....'],

const icW = (id) => ICONS[id][0].length, icH = (id) => ICONS[id].length;
const NAMES = ['Delfino', 'Orki', 'Schildi'];

function newEgg(seed) {
  return { hunger: 80, fun: 80, energy: 80, health: 100, age: 0, seed: (seed >>> 0) || 12345,
    sleeping: false, dead: false, sick: false, plastic: 0, menu: 0, msgIcon: -1, msgNo: false, msgUntil: 0, anim: 0, animArg: 0, animStart: 0,
    now: 0, coolUntil: 0, snd: 0, sndStart: 0, species: 0, speed: 0, vol: 2, sens: 2,
    ui: 0, uiSel: 0, req: 0, batt: -1, chg: false, wifiOk: false, netState: 0, netPct: 0, netErr: 0, ballAns: -1, ballAt: 0, ballUsed: 0 };
}
const clamp = (v) => (v < 0 ? 0 : v > 100 ? 100 : v);
function rnd(S) { S.seed = (Math.imul(S.seed, 1664525) + 1013904223) >>> 0; return (S.seed >>> 16) % 10000; }
const A = { NONE: 0, FEED: 1, PLAY: 2, SLEEP: 3, WAKE: 4, FISH: 5, MEDIC: 6, NEW: 7, WAVES: 8, DIZZY: 9, BUBBLES: 10, STARTLE: 11 };
const SND = { NOPE: 12, ALERT: 13, CLICK: 14 };
const MELS = [null,
  [0, 600, 220, 70, 0, 80, 220, 70, 0, 80, 220, 70, -1],
  [523, 60, 659, 60, 784, 60, 1047, 90, 0, 650, 392, 50, 262, 50, 196, 80, -1],
  [784, 150, 659, 150, 523, 300, -1],
  [523, 110, 659, 110, 784, 110, 1047, 240, -1],
  [0, 450, 1568, 25, 0, 45, 1568, 25, 0, 45, 1568, 25, 0, 45, 1568, 25, 0, 150, 1047, 80, 1319, 140, -1],
  [0, 480, 1319, 80, 0, 40, 1568, 80, 0, 40, 2093, 160, -1],
  [523, 100, 659, 100, 784, 100, 1047, 100, 784, 100, 1047, 260, -1],
  [330, 120, 392, 120, 330, 120, 392, 120, 440, 200, -1],
  [880, 80, 784, 80, 698, 80, 622, 80, 554, 80, 494, 80, 440, 160, -1],
  [1200, 40, 0, 60, 1500, 40, 0, 80, 1300, 40, 0, 60, 1700, 40, -1],
  [1760, 50, 0, 30, 2093, 120, -1],
  [196, 120, 0, 50, 147, 220, -1],
  [1760, 70, 0, 70, 1760, 70, -1],
  [1800, 12, -1]
];
function sfx(S, t, id) { S.snd = id; S.sndStart = t; }
function say(S, t, icon, no = false) { S.msgIcon = icon; S.msgNo = no; S.msgUntil = t + 2500; if (no) sfx(S, t, SND.NOPE); }
function anim(S, t, a, arg = 0) { S.anim = a; S.animArg = arg; S.animStart = t; S.msgUntil = t + 1200 + 2500; sfx(S, t, a); }
const hourOf = (e) => Math.floor(e / 3600) % 24;
function isNight(S) { const hh = hourOf(S.now); return hh >= 22 || hh < 7; }

function step(S) {
  if (S.dead) return;
  S.age += 1;
  const night = isNight(S);
  if (S.sleeping) { S.energy += 0.15; S.hunger -= 0.02; S.fun -= 0.01; }
  else { S.hunger -= 0.05; S.fun -= 0.04; S.energy -= night ? 0.06 : 0.02; }
  S.fun -= 0.01 * S.plastic;
  if (S.sick) S.fun -= 0.02;
  S.hunger = clamp(S.hunger); S.fun = clamp(S.fun); S.energy = clamp(S.energy);
  if (S.sleeping && S.energy >= 100 && !night) S.sleeping = false;
  if (!S.sleeping && night && S.energy < 40) S.sleeping = true;
  if (rnd(S) < 40 && S.plastic < 5) S.plastic++;
  const low = Math.min(S.hunger, S.fun, S.energy);
  const risk = 2 + 3 * S.plastic + (low < 25 ? 6 : 0);
  if (rnd(S) < risk && !S.sick) S.sick = true;
  if (low < 10 || S.sick) S.health -= (low < 10 ? 0.05 : 0) + (S.sick ? 0.04 : 0);
  else S.health += 0.02;
  S.health = clamp(S.health);
  if (S.health <= 0) { S.dead = true; S.sleeping = false; }
}
function actFeed(S, t) {
  if (S.dead) return;
  if (S.sleeping) { say(S, t, I.MOON); return; }
  if (S.hunger > 90) { say(S, t, I.FORK, true); return; }
  S.hunger = clamp(S.hunger + 25); say(S, t, I.HEART); anim(S, t, A.FEED, S.age % 2);
}
function actPlay(S, t) {
  if (S.dead) return;
  if (S.sleeping) { say(S, t, I.MOON); return; }
  if (S.sick) { say(S, t, I.PAD, true); return; }
  if (S.energy < 15) { say(S, t, I.BOLT, true); return; }
  S.fun = clamp(S.fun + 20); S.energy = clamp(S.energy - 8); S.hunger = clamp(S.hunger - 5); say(S, t, I.HEART); anim(S, t, A.PLAY);
}
function actSleep(S, t) {
  if (S.dead) return;
  if (S.sleeping) { S.sleeping = false; say(S, t, I.SUN); anim(S, t, A.WAKE); }
  else { S.sleeping = true; say(S, t, I.MOON); anim(S, t, A.SLEEP); }
}
function actFish(S, t) {
  if (S.dead) return;
  if (S.plastic === 0) { say(S, t, I.ROD, true); return; }
  S.plastic--; S.fun = clamp(S.fun + 5); say(S, t, I.HEART); anim(S, t, A.FISH, S.plastic);
}
function actMedic(S, t) {
  if (S.dead) return;
  if (!S.sick) { say(S, t, I.KIT, true); return; }
  S.sick = false; S.fun = clamp(S.fun - 5); say(S, t, I.HEART); anim(S, t, A.MEDIC);
}
function gShake(S, t, lvl) {
  if (S.dead || t < S.coolUntil) return;
  S.coolUntil = t + 6000;
  if (S.sleeping) { S.sleeping = false; S.fun = clamp(S.fun - 5); say(S, t, -1); anim(S, t, A.STARTLE); return; }
  if (lvl === 1) { S.fun = clamp(S.fun + 10); say(S, t, I.HEART); anim(S, t, A.WAVES); }
  else { S.fun = clamp(S.fun - 15); if (rnd(S) < 3333) S.sick = true; say(S, t, -1); anim(S, t, A.DIZZY); }
}
function catchUp(S, target) {
  if (target <= S.now) return;
  let n = Math.floor((target - S.now) / 10); if (n > 60480) n = 60480;
  for (let i = 0; i < n && !S.dead; i++) { S.now += 10; S.sleeping = true; step(S); }
  S.now = target;
  if (!S.dead && !isNight(S) && S.energy >= 50) S.sleeping = false;
}
function needs(S) { return !S.dead && (S.sick || S.plastic >= 3 || Math.min(S.hunger, S.fun, S.energy) < 25); }
function newGame(S, t, sp) {
  const keep = { now: S.now, speed: S.speed, vol: S.vol, sens: S.sens, batt: S.batt, chg: S.chg, wifiOk: S.wifiOk };
  Object.assign(S, newEgg(S.seed ^ (t | 0)), keep, { species: sp });

}
let SET_ROWS = [0, 1, 2, 3, 4, 5, 6, 7];   // Eintraege im Einstellungsmenue (die Handy-Version laesst Akku, WLAN, Update weg)
const ANSWERS = [

];
function gBall(S, t) {
  if (S.ui !== 5 || (S.ballAns >= 0 && t < S.ballAt + 4000)) return;
  const NA = 18;
  if (S.ballUsed === (1 << NA) - 1) S.ballUsed = S.ballAns >= 0 ? (1 << S.ballAns) : 0;
  let left = 0; for (let i = 0; i < NA; i++) if (!((S.ballUsed >> i) & 1)) left++;
  let k = rnd(S) % left, a = 0;
  for (let i = 0; i < NA; i++) if (!((S.ballUsed >> i) & 1)) { if (k === 0) { a = i; break; } k--; }
  S.ballUsed |= 1 << a;
  S.ballAns = a; S.ballAt = t; sfx(S, t, A.DIZZY);
}
function pressLong(S) { if (S.ui === 0) { S.ui = 1; S.uiSel = 0; } else if (S.ui <= 2 || S.ui === 5) S.ui = 0; else S.ui = 1; }
function pressNext(S) {
  if (S.ui === 1) S.uiSel = (S.uiSel + 1) % (SET_ROWS.length + 1);
  else if (S.ui === 5) { S.ui = 1; S.uiSel = SET_ROWS.length; }
  else if (S.ui === 2) S.uiSel = (S.uiSel + 1) % 4;

}
function pressOk(S, t) {
  if (S.ui === 1) {
    const it = SET_ROWS[S.uiSel];
    if (it === 0) { S.ui = 2; S.uiSel = S.species; }
    else if (it === 1) S.speed = (S.speed + 1) % 3;

    else if (it === 3) S.sens = (S.sens + 1) % 4;
    else if (it === 5) { S.ui = 3; S.req = 1; S.netState = 0; }
    else if (it === 6) { S.ui = 4; S.req = 2; S.netState = 1; S.netPct = 0; S.netErr = 0; }
    else if (it === 7) S.ui = 0;
    else if (S.uiSel === SET_ROWS.length) { S.ui = 5; S.ballAns = -1; }
    return;

  if (S.ui === 2) { if (S.uiSel === 3) { S.ui = 1; S.uiSel = 0; } else { newGame(S, t, S.uiSel); S.ui = 0; } return; }

  if (S.menu === 0) actFeed(S, t); else if (S.menu === 1) actPlay(S, t); else if (S.menu === 2) actSleep(S, t);

const M = { DEAD: 0, SLEEP: 1, SICK: 2, SAD: 3, HAPPY: 4, OK: 5 };
function mood(S) {
  if (S.dead) return M.DEAD;
  if (S.sleeping) return M.SLEEP;
  if (S.sick) return M.SICK;
  const low = Math.min(S.hunger, S.fun, S.energy), avg = (S.hunger + S.fun + S.energy) / 3;
  if (low < 25) return M.SAD;
  return avg >= 60 ? M.HAPPY : M.OK;

// ================= Zeichnen (135 x 240, hochkant) =================

SET_ROWS = [0, 1, 2, 3, 7];   // Handy: neues Spiel, Zeitraffer, Ton, Sensoren, zurueck
(function () {
